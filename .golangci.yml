version: "2"

linters:
  default: none
  enable:
    - copyloopvar
    - errcheck
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    goconst:
      ignore-tests: true
      min-occurrences: 10
    lll:
      line-length: 140
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    paths:
      - internal/pb
    rules:
      - path: _test\.go
        linters:
          - lll
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - internal/pb

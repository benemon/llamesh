# roles/llamesh/tasks/main.yml
---
- name: Check what this host runs
  ansible.builtin.assert:
    that:
      - llamesh_server or llamesh_collector | length > 0
      - llamesh_collector | length == 0 or llamesh_server_host | length > 0
    fail_msg: Set llamesh_server, or llamesh_collector with llamesh_server_host, or both.
    quiet: true

- name: Work out the platform and paths
  ansible.builtin.set_fact:
    _llamesh_os: "{{ ansible_facts.system | lower }}"
    _llamesh_arch: "{{ {'x86_64': 'amd64', 'amd64': 'amd64', 'aarch64': 'arm64', 'arm64': 'arm64'}[ansible_facts.architecture] }}"
    _llamesh_bin: "{{ ansible_facts.user_dir ~ '/.local/bin/llamesh' if ansible_facts.system == 'Darwin' else '/usr/local/bin/llamesh' }}"
    _llamesh_token_path: "{{ ansible_facts.user_dir ~ '/.config/llamesh/token' if ansible_facts.system == 'Darwin' else '/etc/llamesh/token' }}"
    _llamesh_modes: "{{ (['server'] if llamesh_server else []) + (['collector'] if llamesh_collector | length > 0 else []) }}"
    # The host whose server this host's services use: its token, and its TLS settings.
    _llamesh_server_name: "{{ llamesh_server_host if llamesh_collector | length > 0 else inventory_hostname }}"

# Play variables and role parameters are not in hostvars, so the server's host publishes its choice as a
# fact for its collectors to read.
- name: Serve TLS when the server has both a certificate and a key
  ansible.builtin.set_fact:
    _llamesh_server_tls: "{{ llamesh_tls_cert | length > 0 and llamesh_tls_key | length > 0 }}"
  when: llamesh_server

- name: Follow the server's choice of TLS
  ansible.builtin.set_fact:
    _llamesh_tls: "{{ hostvars[_llamesh_server_name]._llamesh_server_tls }}"

- name: Install the release
  ansible.builtin.import_tasks: install.yml

- name: Share the token
  ansible.builtin.import_tasks: token.yml

- name: Write the server's certificate and key
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ _llamesh_token_path | dirname }}/{{ item.name }}"
    mode: "0600"
  loop:
    - { name: tls.crt, content: "{{ llamesh_tls_cert }}" }
    - { name: tls.key, content: "{{ llamesh_tls_key }}" }
  become: "{{ _llamesh_os == 'linux' }}"
  when: llamesh_server and _llamesh_tls
  register: _llamesh_tls_files
  no_log: true

- name: Remove the server's certificate and key without TLS
  ansible.builtin.file:
    path: "{{ _llamesh_token_path | dirname }}/{{ item }}"
    state: absent
  loop: [tls.crt, tls.key]
  become: "{{ _llamesh_os == 'linux' }}"
  when: llamesh_server and not _llamesh_tls

- name: Run the services
  ansible.builtin.include_tasks: "service_{{ _llamesh_os }}.yml"
  loop: "{{ _llamesh_modes }}"
  loop_control:
    loop_var: _llamesh_mode

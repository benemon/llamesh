version: v2
plugins:
  - local: protoc-gen-go
    out: internal/pb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/pb
    opt: paths=source_relative
  - local: web/node_modules/.bin/protoc-gen-ts_proto
    out: web/src/pb
    opt:
      - onlyTypes=true
      - snakeToCamel=false
      - stringEnums=true
      - useOptionals=messages
      - outputServices=false
